[package]
name = "diarize-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.3", features = ["derive"] }
sherpa-onnx = "1.13"
hound = "3.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"  # Optimize for size for faster loading
