# Fork maintenance: track Zackriya-Solutions/meeting-minutes.
#
# main is the fork's product branch (features merged in), so upstream is
# integrated by MERGE, not rebase:
#   1. upstream-main is kept as a pristine fast-forward mirror of upstream
#      (never conflicts; useful for diffing fork vs upstream).
#   2. upstream/main is merged into main. A clean merge is pushed
#      automatically; a conflict fails the job loudly for manual resolution:
#      git fetch upstream && git merge upstream/main  (resolve, push)
name: Sync with upstream

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    # Never run on the upstream repo itself, only on the fork
    if: github.repository == 'jorgeamado/meetily'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update upstream-main mirror
        run: |
          git remote add upstream https://github.com/Zackriya-Solutions/meeting-minutes.git
          git fetch upstream main
          git push origin +refs/remotes/upstream/main:refs/heads/upstream-main

      - name: Merge upstream into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "main already contains upstream/main"
            exit 0
          fi
          echo "Merging $BEHIND new upstream commits into main"
          git merge --no-edit upstream/main
          git push origin main

      - name: Report conflict
        if: failure()
        run: |
          echo "::error::Merging upstream/main into main hit a conflict. Resolve locally: git fetch upstream && git merge upstream/main (fix conflicts) && git push origin main. The upstream-main mirror branch is already updated for diffing."
